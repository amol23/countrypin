        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #141e30);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .scene {
            width: 360px; 
            height: 460px; 
            max-height: 90vh; 
            max-width: 95vw; 
            perspective: 1000px;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 1.2s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .scene.is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        .scene.is-flipped .card-front {
            opacity: 0;
            transition: opacity 0.1s 0.3s; 
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            text-align: center;
            padding: 30px; 
            box-sizing: border-box;
        }

        .card-back {
            transform: rotateY(180deg);
            justify-content: flex-start;
            padding-top: 35px;
        }

        .globe {
            width: 60px; 
            height: 60px;
            position: relative;
            transform-style: preserve-3d;
            animation: spinGlobe 3s linear infinite;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        
        .card-back .globe {
            margin-top: 20px;
            margin-bottom: 0;
            width: 50px;
            height: 50px;
        }
        
        .globe-ring {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }
        .globe-ring:nth-child(1) { transform: rotateY(0deg); }
        .globe-ring:nth-child(2) { transform: rotateY(60deg); }
        .globe-ring:nth-child(3) { transform: rotateY(120deg); }
        .globe-ring:nth-child(4) { transform: rotateX(90deg); }

        @keyframes spinGlobe {
            0% { transform: rotate3d(1, 1, 0, 0deg); }
            100% { transform: rotate3d(1, 1, 0, 360deg); }
        }

        #status-message {
            font-size: 16px;
            letter-spacing: 1px;
            color: #ccc;
            animation: pulseText 1.5s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        #greeting-text {
            font-size: 22px;
            font-weight: bold;
            color: #64b5f6;
            margin-bottom: 10px;
        }

        #trivia-text {
            font-size: 15px;
            line-height: 1.4;
            color: #e0e0e0;
            margin-bottom: 25px;
            min-height: 80px; /* Keeps the card from jumping around if facts are different lengths */
        }

        #trivia-text strong {
            color: #fff;
            font-size: 24px;
            display: block;
            margin: 6px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #flag {
            max-width: 120px; 
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: float 4s ease-in-out infinite;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        
        #clock-container {
            margin-top: 15px;
            font-size: 12px;
            color: #aaa;
            letter-spacing: 0.5px;
            display: none; 
        }
        
        #local-time {
            font-size: 16px;
            color: #fff;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }

        function getGreeting() {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return "Good Morning! 🌅";
            if (hour >= 12 && hour < 17) return "Good Afternoon! ☀️";
            if (hour >= 17 && hour < 22) return "Good Evening! 🌇";
            return "Up late? 🌙";
        }

        function startClock(timezoneString) {
            const timeElement = document.getElementById('local-time');
            const tzElement = document.getElementById('timezone-info');
            
            tzElement.textContent = timezoneString;

            setInterval(() => {
                const now = new Date();
                const timeString = now.toLocaleTimeString('en-US', {
                    timeZone: timezoneString,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
                timeElement.textContent = timeString;
            }, 1000);
        }

        async function detectCountry() {
            try {
                document.getElementById('greeting-text').textContent = getGreeting();

                const waitThreeSeconds = new Promise(resolve => setTimeout(resolve, 3000));
                const fetchLocationData = fetch('https://get.geojs.io/v1/ip/geo.json').then(res => res.json());

                const [_, data] = await Promise.all([waitThreeSeconds, fetchLocationData]);

                const countryCode = data.country_code.toLowerCase();
                
                // --- NEW RANDOMIZER LOGIC ---
                // Grabs the array of facts for the country, or uses the default array
                const factsArray = countryIndicators[countryCode] || ["its beautiful landscapes and unique cultural heritage"];
                
                // Picks a random fact from the chosen array
                const randomFact = factsArray[Math.floor(Math.random() * factsArray.length)];
                
                document.getElementById('trivia-text').innerHTML = `
                    Browsing from
                    <strong>${data.country}</strong>
                    famous for ${randomFact}.
                `;
                
                const flagElement = document.getElementById('flag');
                flagElement.src = `https://flagcdn.com/w160/${countryCode}.png`;
                
                flagElement.onload = () => {
                    flagElement.style.display = 'block';
                    
                    document.getElementById('clock-container').style.display = 'block';
                    startClock(data.timezone);
                    
                    document.getElementById('card-scene').classList.add('is-flipped');
                };

            } catch (error) {
                document.getElementById('status-message').textContent = "Couldn't detect location.";
                const frontGlobe = document.querySelector('.card-front .globe');
                if(frontGlobe) {
                    frontGlobe.style.animation = 'none';
                    frontGlobe.style.opacity = '0.2';
                }
            }
        }
