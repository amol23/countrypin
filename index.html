<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountryPin</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #141e30);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .scene {
            width: 360px; 
            height: 460px; 
            max-height: 90vh; 
            max-width: 95vw; 
            perspective: 1000px;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 1.2s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .scene.is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        .scene.is-flipped .card-front {
            opacity: 0;
            transition: opacity 0.1s 0.3s; 
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            text-align: center;
            padding: 30px; 
            box-sizing: border-box;
        }

        .card-back {
            transform: rotateY(180deg);
            justify-content: flex-start;
            padding-top: 35px;
        }

        .globe {
            width: 60px; 
            height: 60px;
            position: relative;
            transform-style: preserve-3d;
            animation: spinGlobe 1s linear infinite;
            margin-bottom: 20px;
            flex-shrink: 0;
        }
        
        .card-back .globe {
            margin-top: 20px;
            margin-bottom: 0;
            width: 50px;
            height: 50px;
        }
        
        .globe-ring {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }
        .globe-ring:nth-child(1) { transform: rotateY(0deg); }
        .globe-ring:nth-child(2) { transform: rotateY(60deg); }
        .globe-ring:nth-child(3) { transform: rotateY(120deg); }
        .globe-ring:nth-child(4) { transform: rotateX(90deg); }

        @keyframes spinGlobe {
            0% { transform: rotate3d(1, 1, 0, 0deg); }
            100% { transform: rotate3d(1, 1, 0, 360deg); }
        }

        #status-message {
            font-size: 16px;
            letter-spacing: 1px;
            color: #ccc;
            animation: pulseText 1.5s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        #greeting-text {
            font-size: 22px;
            font-weight: bold;
            color: #64b5f6;
            margin-bottom: 10px;
        }

        #trivia-text {
            font-size: 15px;
            line-height: 1.4;
            color: #e0e0e0;
            margin-bottom: 25px;
        }

        #trivia-text strong {
            color: #fff;
            font-size: 24px;
            display: block;
            margin: 6px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #flag {
            max-width: 120px; 
            border-radius: 6px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            animation: float 4s ease-in-out infinite;
            margin-bottom: 10px;
            flex-shrink: 0;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }
        
        /* New Clock Styling */
        #clock-container {
            margin-top: 15px;
            font-size: 12px;
            color: #aaa;
            letter-spacing: 0.5px;
            display: none; /* Hidden until loaded */
        }
        
        #local-time {
            font-size: 16px;
            color: #fff;
            font-weight: bold;
            display: block;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <div class="scene" id="card-scene">
        <div class="card-inner">
            
            <div class="card-face card-front">
                <div class="globe">
                    <div class="globe-ring"></div>
                    <div class="globe-ring"></div>
                    <div class="globe-ring"></div>
                    <div class="globe-ring"></div>
                </div>
                <div id="status-message">Locating you...</div>
            </div>

            <div class="card-face card-back">
                <div id="greeting-text"></div>
                <div id="trivia-text"></div>
                <img id="flag" src="" alt="Country Flag" style="display:none;">

                <div id="clock-container">
                    <span id="local-time"></span>
                    <span id="timezone-info"></span>
                </div>

                <div class="globe">
                    <div class="globe-ring"></div>
                    <div class="globe-ring"></div>
                    <div class="globe-ring"></div>
                    <div class="globe-ring"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const countryIndicators = {
            // North & Central America
            "us": "the Grand Canyon and bustling New York City",
            "ca": "the breathtaking Rocky Mountains and vast wilderness",
            "mx": "ancient Mayan ruins and incredible cuisine",
            "cu": "its vintage cars, vibrant music, and colorful Havana streets",
            "pa": "the incredible Panama Canal and beautiful rainforests",
            "cr": "its rich biodiversity, volcanoes, and pura vida lifestyle",
            "jm": "reggae music, pristine beaches, and vibrant culture",
            
            // South America
            "br": "the vast Amazon Rainforest and vibrant Carnival",
            "ar": "the passionate tango and stunning Patagonia",
            "co": "its rich coffee heritage and vibrant biodiversity",
            "cl": "the arid Atacama Desert and stunning Andean peaks",
            "pe": "the ancient Incan citadel of Machu Picchu and the Andes",
            "ve": "the magnificent Angel Falls and Caribbean coastlines",
            "ec": "the unique Galapagos Islands and equatorial landscapes",
            "uy": "its beautiful Atlantic beaches and thriving art scene",
            
            // Europe
            "fr": "the romantic city of Paris and the Eiffel Tower",
            "gb": "historic London and the iconic Big Ben",
            "de": "the beautiful Bavarian Alps and historic castles",
            "it": "the historic Colosseum and winding canals of Venice",
            "es": "beautiful Barcelona and sunny Mediterranean beaches",
            "ru": "the vast Siberian tundra and historic Red Square",
            "ch": "the spectacular Swiss Alps and pristine lakes",
            "gr": "the ancient Acropolis and stunning islands",
            "nl": "its beautiful tulips, windmills, and cycling culture",
            "se": "its stunning archipelagos and innovative design",
            "no": "its breathtaking fjords and the spectacular Northern Lights",
            "pt": "its historic explorers, beautiful coastlines, and Fado music",
            "pl": "its resilient history and hearty pierogi",
            "ie": "its rolling green hills, rich folklore, and historic pubs",
            "at": "its classical music heritage and the majestic Alps",
            "be": "its world-class chocolate, waffles, and medieval towns",
            "dk": "its happy lifestyle, historic castles, and beautiful coastlines",
            "fi": "its thousands of lakes and spectacular saunas",
            "cz": "the stunning architecture of Prague and rich history",
            "hu": "the thermal baths of Budapest and grand architecture",
            "ua": "its rich agricultural plains and deep cultural resilience",
            "ro": "the legends of Transylvania and the beautiful Carpathian Mountains",
            
            // Asia
            "cn": "the ancient Great Wall and rich traditions",
            "in": "the magnificent Taj Mahal and vibrant culture",
            "jp": "the beautiful Mount Fuji and cherry blossoms",
            "kr": "dynamic Seoul and rich technological innovation",
            "id": "the tropical beaches of Bali and volcanic islands",
            "th": "beautiful tropical beaches and stunning temples",
            "vn": "the stunning Ha Long Bay and delicious pho",
            "ph": "its thousands of tropical islands and warm hospitality",
            "my": "the iconic Petronas Towers and diverse culinary scene",
            "pk": "the majestic peaks of the Karakoram and rich cultural heritage",
            "bd": "the vast Sundarbans mangrove forest and vibrant textile industry",
            "sg": "its stunning futuristic skyline and spotless streets",
            "lk": "its ancient ruins, beautiful tea gardens, and rich wildlife",
            "np": "the towering peak of Mount Everest and rich spiritual heritage",
            "mm": "the ancient temples of Bagan and beautiful golden pagodas",
            "kh": "the magnificent ancient temple complex of Angkor Wat",
            
            // Middle East
            "tr": "the historic city of Istanbul and Cappadocia",
            "ae": "the towering Burj Khalifa and luxurious futuristic cities",
            "sa": "its vast deserts and the holy cities of Mecca and Medina",
            "eg": "the majestic Pyramids of Giza and the Nile River",
            "il": "its ancient historical sites and innovative tech scene",
            "qa": "its ultra-modern architecture and stunning desert landscapes",
            "kw": "its striking modern towers and rich maritime history",
            "jo": "the ancient rock-cut architecture of Petra",
            "lb": "its vibrant capital Beirut and the ancient cedar forests",
            
            // Africa
            "za": "the iconic Table Mountain and diverse wildlife",
            "ng": "its booming Nollywood film industry and dynamic culture",
            "ke": "its spectacular savanna safaris and the Great Migration",
            "ma": "the bustling souks of Marrakech and the vast Sahara",
            "et": "its ancient rock-hewn churches and being the birthplace of coffee",
            "tz": "the majestic Mount Kilimanjaro and the Serengeti plains",
            "gh": "its welcoming culture, historic forts, and beautiful coastlines",
            "ug": "its lush landscapes and rare mountain gorillas",
            "dz": "the immense Sahara Desert and Mediterranean coastlines",
            "sn": "its rich musical heritage and vibrant capital, Dakar",
            
            // Oceania
            "au": "the Great Barrier Reef and the rugged Outback",
            "nz": "the breathtaking fjords and Maori heritage",
            "fj": "its soft coral reefs, clear lagoons, and welcoming culture",
            "pg": "its immense cultural diversity and rugged rainforests"
        };

        function getGreeting() {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return "Good Morning! 🌅";
            if (hour >= 12 && hour < 17) return "Good Afternoon! ☀️";
            if (hour >= 17 && hour < 22) return "Good Evening! 🌇";
            return "Up late? 🌙";
        }

        // Live Clock Function
        function startClock(timezoneString) {
            const timeElement = document.getElementById('local-time');
            const tzElement = document.getElementById('timezone-info');
            
            // Set the timezone info text once
            tzElement.textContent = timezoneString;

            // Update the clock every second
            setInterval(() => {
                const now = new Date();
                // We use toLocaleTimeString with the specific timezone returned by the API
                const timeString = now.toLocaleTimeString('en-US', {
                    timeZone: timezoneString,
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit',
                    hour12: true
                });
                timeElement.textContent = timeString;
            }, 1000);
        }

        async function detectCountry() {
            try {
                document.getElementById('greeting-text').textContent = getGreeting();

                const waitThreeSeconds = new Promise(resolve => setTimeout(resolve, 3000));
                const fetchLocationData = fetch('https://get.geojs.io/v1/ip/geo.json').then(res => res.json());

                const [_, data] = await Promise.all([waitThreeSeconds, fetchLocationData]);

                const countryCode = data.country_code.toLowerCase();
                const specificIndicator = countryIndicators[countryCode] || "its beautiful landscapes and unique cultural heritage";
                
                document.getElementById('trivia-text').innerHTML = `
                    Browsing from
                    <strong>${data.country}</strong>
                    famous for ${specificIndicator}.
                `;
                
                const flagElement = document.getElementById('flag');
                flagElement.src = `https://flagcdn.com/w160/${countryCode}.png`;
                
                flagElement.onload = () => {
                    flagElement.style.display = 'block';
                    
                    // Show and start the clock right as the card flips
                    document.getElementById('clock-container').style.display = 'block';
                    startClock(data.timezone);
                    
                    document.getElementById('card-scene').classList.add('is-flipped');
                };

            } catch (error) {
                document.getElementById('status-message').textContent = "Couldn't detect location.";
                const frontGlobe = document.querySelector('.card-front .globe');
                if(frontGlobe) {
                    frontGlobe.style.animation = 'none';
                    frontGlobe.style.opacity = '0.2';
                }
            }
        }

        detectCountry();
    </script>

</body>
</html>
