<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountryPin</title>
    
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📍</text></svg>">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #141e30);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #fff;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .scene {
            width: 400px; /* Widened slightly for news headlines */
            height: 650px; /* Made taller to fit the news section */
            perspective: 1000px;
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 1.2s cubic-bezier(0.4, 0.2, 0.2, 1);
            transform-style: preserve-3d;
        }

        .scene.is-flipped .card-inner {
            transform: rotateY(180deg);
        }

        .scene.is-flipped .card-front {
            opacity: 0;
            transition: opacity 0.1s 0.3s; 
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden; 
            backface-visibility: hidden;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
            box-sizing: border-box;
        }

        .card-back {
            transform: rotateY(180deg);
            padding: 30px; 
            justify-content: flex-start; 
            overflow-y: auto; /* Adds a scrollbar if news titles are too long */
        }

        /* Custom Scrollbar for the card back */
        .card-back::-webkit-scrollbar { width: 6px; }
        .card-back::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }

        .globe {
            width: 60px; /* Slightly smaller to save space */
            height: 60px;
            position: relative;
            transform-style: preserve-3d;
            animation: spinGlobe 3s linear infinite;
            margin-bottom: 20px;
        }
        
        .card-back .globe {
            margin-top: 25px;
            margin-bottom: 0;
            width: 50px;
            height: 50px;
        }
        
        .globe-ring {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            border: 3px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
        }
        .globe-ring:nth-child(1) { transform: rotateY(0deg); }
        .globe-ring:nth-child(2) { transform: rotateY(60deg); }
        .globe-ring:nth-child(3) { transform: rotateY(120deg); }
        .globe-ring:nth-child(4) { transform: rotateX(90deg); }

        @keyframes spinGlobe {
            0% { transform: rotate3d(1, 1, 0, 0deg); }
            100% { transform: rotate3d(1, 1, 0, 360deg); }
        }

        #status-message {
            font-size: 18px;
            letter-spacing: 1px;
            color: #ccc;
            animation: pulseText 1.5s ease-in-out infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        #greeting-text {
            font-size: 22px;
            font-weight: bold;
            color: #64b5f6;
            margin-bottom: 5px;
        }

        #trivia-text {
            font-size: 15px;
            line-height: 1.4;
            color: #e0e0e0;
            margin-bottom: 20px;
        }

        #trivia-text strong {
            color: #fff;
            font-size: 22px;
            display: block;
            margin: 5px 0;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #flag {
            max-width: 120px;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            animation: float 4s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        /* --- News Section Styling --- */
        .news-container {
            width: 100%;
            text-align: left;
            margin-top: 5px;
        }

        .news-header {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #aaa;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.2);
            padding-bottom: 5px;
        }

        .news-item {
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
            line-height: 1.4;
            transition: background 0.2s;
        }

        .news-item:hover {
            background: rgba(0, 0, 0, 0.4);
        }

        .news-item a {
            color: #fff;
            text-decoration: none;
            display: block;
        }

        .news-item a span {
            color: #64b5f6;
            font-size: 11px;
            display: block;
            margin-top: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="scene" id="card-scene">
        <div class="card-inner">
            
            <div class="card-face card-front">
                <div class="globe">
                    <div class="globe-ring"></div>
                    <div class="globe-ring"></div>
                    <div class="globe-ring"></div>
                    <div class="globe-ring"></div>
                </div>
                <div id="status-message">Locating you...</div>
            </div>

            <div class="card-face card-back">
                <div id="greeting-text"></div>
                <div id="trivia-text"></div>
                <img id="flag" src="" alt="Country Flag" style="display:none;">

                <div class="news-container">
                    <div class="news-header" id="news-header">Latest Local News</div>
                    <div id="news-list">
                        </div>
                </div>

                <div class="globe">
                    <div class="globe-ring"></div>
                    <div class="globe-ring"></div>
                    <div class="globe-ring"></div>
                    <div class="globe-ring"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // === REPLACE THIS WITH YOUR GNEWS.IO API KEY ===
        const GNEWS_API_KEY = 'YOUR_API_KEY_HERE'; 
        // ===============================================

        const countryIndicators = {
            "us": "the Grand Canyon and bustling New York City",
            "ca": "the breathtaking Rocky Mountains and vast wilderness",
            "mx": "ancient Mayan ruins and incredible cuisine",
            "gb": "historic London and the iconic Big Ben",
            "in": "the magnificent Taj Mahal and vibrant culture",
            "au": "the Great Barrier Reef and the rugged Outback",
            // (You can paste the full list of 50+ countries we made earlier right here!)
        };

        // Determine Time of Day
        function getGreeting() {
            const hour = new Date().getHours();
            if (hour >= 5 && hour < 12) return "Good Morning! 🌅";
            if (hour >= 12 && hour < 17) return "Good Afternoon! ☀️";
            if (hour >= 17 && hour < 22) return "Good Evening! 🌇";
            return "Up late? 🌙";
        }

        async function fetchNews(countryCode) {
            const newsList = document.getElementById('news-list');
            try {
                // Fetch top 3 general headlines for the detected country
                const url = `https://gnews.io/api/v4/top-headlines?category=general&country=${countryCode}&max=3&apikey=${GNEWS_API_KEY}`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.articles && data.articles.length > 0) {
                    newsList.innerHTML = ''; // Clear loading text
                    data.articles.forEach(article => {
                        newsList.innerHTML += `
                            <div class="news-item">
                                <a href="${article.url}" target="_blank" rel="noopener noreferrer">
                                    ${article.title}
                                    <span>Read Source ↗</span>
                                </a>
                            </div>
                        `;
                    });
                } else {
                    newsList.innerHTML = '<div class="news-item">No recent news found for your region.</div>';
                }
            } catch (error) {
                console.error("News fetch error:", error);
                newsList.innerHTML = '<div class="news-item">Unable to load live news right now.</div>';
            }
        }

        async function detectCountry() {
            try {
                // Display the dynamic greeting
                document.getElementById('greeting-text').textContent = getGreeting();

                const waitThreeSeconds = new Promise(resolve => setTimeout(resolve, 3000));
                const fetchLocationData = fetch('https://get.geojs.io/v1/ip/geo.json').then(res => res.json());

                const [_, data] = await Promise.all([waitThreeSeconds, fetchLocationData]);

                const countryCode = data.country_code.toLowerCase();
                const specificIndicator = countryIndicators[countryCode] || "its beautiful landscapes and unique cultural heritage";
                
                document.getElementById('trivia-text').innerHTML = `
                    Browsing from
                    <strong>${data.country}</strong>
                    famous for ${specificIndicator}.
                `;
                
                // Start fetching the news in the background using the country code
                fetchNews(countryCode);

                const flagElement = document.getElementById('flag');
                flagElement.src = `https://flagcdn.com/w160/${countryCode}.png`;
                
                flagElement.onload = () => {
                    flagElement.style.display = 'block';
                    document.getElementById('card-scene').classList.add('is-flipped');
                };

            } catch (error) {
                document.getElementById('status-message').textContent = "Couldn't detect location.";
                const frontGlobe = document.querySelector('.card-front .globe');
                if(frontGlobe) {
                    frontGlobe.style.animation = 'none';
                    frontGlobe.style.opacity = '0.2';
                }
            }
        }

        detectCountry();
    </script>

</body>
</html>
